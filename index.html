function init(){load();ui.year=Number(data.settings?.year)||2026;ui.month=/^\d{4}-\d{2}$/.test(data.settings?.month)?data.settings.month:'2026-11';const hash=location.hash.slice(1);if(['dashboard','income','payments','debts'].includes(hash))ui.page=hash;makeStars();render()}
function yearList(){return [...new Set([...YEARS,ui.year,...data.ledger.map(x=>Number(String(x.date||'').slice(0,4))).filter(Number.isFinite)])].sort((a,b)=>a-b)}
function yearRows(y=ui.year){return data.ledger.filter(x=>String(x.date||'').startsWith(String(y))&&x.included!==false)}
function yearStats(y=ui.year){const rec=yearRows(y);const salary=rec.filter(x=>x.category==='本業薪資'||x.category==='獎金津貼').reduce((s,x)=>s+Number(x.amount||0),0);const total=rec.reduce((s,x)=>s+Number(x.amount||0),0);return {total,salary,other:total-salary,count:rec.length}}
function debtStats(){const known=data.debts.filter(x=>x.outstanding!==null&&x.outstanding!==undefined&&Number.isFinite(Number(x.outstanding)));return {known:known.reduce((s,x)=>s+Math.max(0,Number(x.outstanding)),0),unknown:data.debts.filter(x=>x.outstanding==null).length,open:data.debts.filter(x=>x.status!=='已結清').length,closed:data.debts.filter(x=>x.status==='已結清').length}}
function activeBills(month=ui.month){return data.bills.filter(b=>(!b.startMonth||b.startMonth<=month)&&(!b.endMonth||b.endMonth>=month))}
function getPayment(month,id){return data.payments[month]?.[id]||{status:'pending',amount:null,note:''}}
function billAmt(b,month){const s=getPayment(month,b.id);return s.amount!=null?Number(s.amount):(b.amount!=null?Number(b.amount):null)}
function paymentStats(month=ui.month){const bills=activeBills(month);let planned=0,paid=0,unpaid=0,pending=0,unknown=0,paidCount=0;
for(const b of bills){let n=billAmt(b,month),status=getPayment(month,b.id).status;if(n==null)unknown++;else{planned+=n;if(status==='paid')paid+=n;else if(status==='unpaid')unpaid+=n;else if(status==='pending')pending+=n}if(status==='paid')paidCount++}
return {bills,planned,paid,unpaid,pending,unknown,paidCount,percent:bills.length?Math.round(paidCount/bills.length*100):0}}
function monthIncome(ym){return data.ledger.filter(x=>x.included!==false&&String(x.date||'').startsWith(ym)).reduce((s,x)=>s+Number(x.amount||0),0)}
function topStat(label,val,hint,icon,kind='pink',tint='#fff1f8'){return `<article class="stat" style="--tint:${tint}"><div class="tag">${esc(label)} <i>${icon}</i></div><div class="num ${kind}" data-count="${Number.isFinite(val)?val:''}">${val==null?'未填':moneyLabel(val)}</div><div class="hint">${esc(hint)}</div></article>`}

function incomeRow(x){const val=Number(x.amount||0),open=ui.expandedId===x.id,source=x.source==='Excel'?`Excel 第${x.sourceRow||'—'}列`:'手動新增';return `<tr><td class="muted">${esc(formatDate(x.date))}</td><td><div class="item-title">${esc(x.title||'未命名')}</div><div class="item-meta">${x.party?esc(x.party)+' ・ ':''}${esc(x.status||'')}${x.included===false?' ・ 未計入':''}</div></td><td><span class="pill ${x.category==='本業薪資'?'paid':''}">${CATEGORY_EMOJI[x.category]||'✨'} ${esc(x.category)}</span></td><td><span class="amount ${val<0?'negative':''}">${signed(val)}</span></td><td><span class="badge-source">${esc(source)}</span></td><td><div class="actions"><button class="iconbtn" title="展開細項" aria-label="展開細項" data-action="expand" data-id="${esc(x.id)}">${open?'⌃':'⌄'}</button><button class="iconbtn" title="修改" aria-label="修改紀錄" data-action="edit-income" data-id="${esc(x.id)}">✎</button><button class="iconbtn danger" title="刪除" aria-label="刪除紀錄" data-action="delete-income" data-id="${esc(x.id)}">×</button></div></td></tr>${open?`<tr class="detail-row"><td colspan="6"><div class="detail-grid"><div><small>售價／收入 Q 欄</small><b>${moneyLabel(x.revenue)}</b></div><div><small>進貨成本 N 欄</small><b>${moneyLabel(x.cost)}</b></div><div><small>運費 O 欄</small><b>${moneyLabel(x.shipping)}</b></div><div><small>贈品 P 欄</small><b>${moneyLabel(x.gift)}</b></div><div><small>數量</small><b>${x.qty==null?'—':money(x.qty)}</b></div><div><small>下單管道</small><b>${esc(x.channel||'—')}</b></div><div><small>是否計入</small><b>${x.included===false?'不計入':'計入年度總額'}</b></div><div><small>原 Excel 列</small><b>${esc(x.sourceRow||'手動')}</b></div></div><p class="soft-note" style="margin-bottom:0">${esc(x.memo||'沒有備註')}</p></td></tr>`:''}`}

function modal(title,sub,body){document.getElementById('modal-content').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="iconbtn" data-action="close-modal" aria-label="關閉">×</button></div><div class="modal-sub">${sub}</div><div class="modal-body">${body}</div>`;const d=document.getElementById('modal');if(!d.open)d.showModal()}

let body=`<form data-form="income" data-id="${esc(id||'')}"><div class="form-grid">${field('日期 *','date',e.date,'date','required')}${selectField('分類 *','category',e.category,CATEGORIES.map(x=>[x,x]))}${field('收入項目名稱 *','title',e.title,'text','required maxlength="140"',true)}${field('淨收入金額（NT$）*','amount',e.amount,'number','required step="0.01"','', '可輸入負數；此金額會計入總表')}${selectField('是否計入總表','included',e.included===false?'false':'true',[['true','計入收入'],['false','只保留明細不計入']])}${field('銷售收入／售價','revenue',e.revenue,'number','step="0.01"')}${field('商品／授課成本','cost',e.cost,'number','step="0.01"')}${field('運費','shipping',e.shipping,'number','step="0.01"')}${field('贈品成本','gift',e.gift,'number','step="0.01"')}${field('數量','qty',e.qty,'number','step="0.01"')}${field('對象／買家','party',e.party)}${field('來源管道','channel',e.channel)}${field('原始狀態','status',e.status)}${textareaField('備註','memo',e.memo)}</div>${formButtons()}</form>`;
modal(edit?'✏️ 修改收入紀錄':'💰 新增一筆收入',`${edit?`資料來源：${esc(e.source||'手動新增')} ${e.sourceRow?'／原表第 '+e.sourceRow+' 列':''}`:'輸入後會立刻計入對應年份的總額。'}｜售價、成本屬參考細項，不會再重複加總。`,body)}
function openBill(id){const b=data.bills.find(x=>x.id===id)||{name:'',amount:null,method:'',dueDay:null,recurring:true,startMonth:ui.month,endMonth:'',memo:''};let f=`<form data-form="bill" data-id="${esc(id||'')}"><div class="form-grid">${field('繳費項目 *','name',b.name,'text','required maxlength="100"',true)}${field('每月金額（NT$）','amount',b.amount,'number','step="0.01" min="0"','','空白代表尚未設定，和 0 元不同')}${field('付款方式','method',b.method)}${selectField('項目類型','recurring',b.recurring?'true':'false',[['true','每月固定繳費'],['false','單一月份繳費']])}${field('繳費日（1～31）','dueDay',b.dueDay,'number','min="1" max="31"')}${field('開始月份','startMonth',b.startMonth||ui.month,'month','required')}${field('結束月份','endMonth',b.endMonth||'','month','','','空白代表沒有結束月份；單次項目只顯示開始月份')}${textareaField('備註','memo',b.memo)}</div>${formButtons()}</form>`;modal(id?'📝 修改繳費項目':'🍡 新增繳費項目','修改固定項目會影響尚未個別覆寫金額的月份；每月已勾選狀態會保留。',f)}
function openPayment(id){const b=data.bills.find(x=>x.id===id);if(!b)return;const p=getPayment(ui.month,id);let f=`<form data-form="payment" data-id="${esc(id)}"><div class="form-grid">${field('繳費月份','displayMonth',fmtMonth(ui.month),'text','disabled',true)}${selectField('本月繳費狀態','status',p.status||'pending',[['pending','待確認'],['paid','已繳'],['unpaid','未繳'],['skip','本月略過']])}${field('本月應繳金額（可覆寫）','amount',p.amount,'number','min="0" step="0.01"','','留空則使用固定項目金額')}${field('繳費確認日期','paidAt',p.paidAt||'','date')}${textareaField('本月繳費備註','note',p.note||'')}</div>${formButtons()}</form>`;modal(`🧁 ${esc(b.name)}・本月紀錄`,`正在編輯 ${fmtMonth(ui.month)} 的繳費狀態與金額，不會改動其他月份。`,f)}
function openDebt(id){const d=data.debts.find(x=>x.id===id)||{name:'',principal:null,total:null,periods:null,paidPeriods:null,monthly:null,outstanding:null,estimatedEnd:'',status:'進行中',memo:''};let f=`<form data-form="debt" data-id="${esc(id||'')}"><div class="form-grid">${field('負債名稱 *','name',d.name,'text','required maxlength="100"',true)}${selectField('狀態','status',d.status||'進行中',[['進行中','進行中'],['未填資料','未填資料'],['已結清','已結清']])}${field('目前剩餘債務（NT$）','outstanding',d.outstanding,'number','step="0.01" min="0"','','空白代表未知，不會當成 0')}${field('借款本金','principal',d.principal,'number','step="0.01" min="0"')}${field('總還款金額（含息）','total',d.total,'number','step="0.01" min="0"')}${field('每月還款金額','monthly',d.monthly,'number','step="0.01" min="0"')}${field('總期數','periods',d.periods,'number','min="0" step="1"')}${field('已繳期數','paidPeriods',d.paidPeriods,'number','min="0" step="1"')}${field('預計還清月份','estimatedEnd',d.estimatedEnd)}${textareaField('備註','memo',d.memo)}</div>${formButtons()}</form>`;modal(id?'✏️ 修改負債':'🧾 新增負債','請填寫銀行或帳單的最新剩餘餘額；不會直接用原始借款金額取代。',f)}
function setPayment(id,status){const b=data.bills.find(x=>x.id===id);if(!b)return;data.payments[ui.month] ||= {};const p=data.payments[ui.month][id]||{amount:null,note:''};p.status=status;p.paidAt=status==='paid'?new Date().toLocaleDateString('sv-SE'):'';data.payments[ui.month][id]=p;save();render();toast(status==='paid'?'🎉 已勾選！你的努力值得一顆小愛心 ♡':status==='unpaid'?'📝 已標記為未繳，別忘了確認喔':'💭 已更新繳費狀態');if(status==='paid')confetti()}
function getFormValues(form){const fd=new FormData(form);return Object.fromEntries(fd.entries())}
function validNumber(x,label){if(x===''||x==null)return null;const n=Number(x);if(!Number.isFinite(n))throw Error(label+'必須是有效的數字');return n}
function handleSubmit(form){const v=getFormValues(form),id=form.dataset.id,kind=form.dataset.form;
try{if(kind==='income'){
 if(!v.title?.trim()||!/^\d{4}-\d{2}-\d{2}$/.test(v.date))throw Error('請填寫收入項目與日期');const val=validNumber(v.amount,'淨收入金額');if(val==null)throw Error('請填寫收入金額');
 const old=data.ledger.find(x=>x.id===id);const rec={...(old||{}),id:id||uid(),date:v.date,category:v.category,title:v.title.trim(),amount:val,revenue:validNumber(v.revenue,'售價'),cost:validNumber(v.cost,'成本'),shipping:validNumber(v.shipping,'運費'),gift:validNumber(v.gift,'贈品成本'),qty:validNumber(v.qty,'數量'),party:v.party||'',channel:v.channel||'',status:v.status||'',memo:v.memo||'',source:old?.source||'手動新增',included:v.included!=='false'};
 if(old)Object.assign(old,rec);else data.ledger.push(rec);ui.year=Number(v.date.slice(0,4));ui.incomeLimit=45;ui.incomeQuery='';ui.incomeFilter='全部';
}else if(kind==='bill'){
 if(!v.name?.trim())throw Error('請填寫繳費項目');const amt=validNumber(v.amount,'繳費金額');if(amt!=null&&amt<0)throw Error('繳費金額不可為負數');const start=v.startMonth;const recurring=v.recurring==='true';if(!/^\d{4}-\d{2}$/.test(start))throw Error('請填寫起始月份');if(recurring&&v.endMonth&&v.endMonth<start)throw Error('結束月份不可早於開始月份');
 const old=data.bills.find(x=>x.id===id);const b={...(old||{}),id:id||uid(),name:v.name.trim(),amount:amt,method:v.method||'',dueDay:v.dueDay?validNumber(v.dueDay,'繳費日'):null,recurring,startMonth:start,endMonth:recurring?(v.endMonth||''):start,memo:v.memo||'',source:old?.source||'手動新增'};
 if(old)Object.assign(old,b);else data.bills.push(b);ui.month=start>ui.month?start:ui.month;
}else if(kind==='payment'){
 const b=data.bills.find(x=>x.id===id);if(!b)throw Error('找不到此繳費項目');const amt=validNumber(v.amount,'金額');if(amt!=null&&amt<0)throw Error('金額不可為負數');data.payments[ui.month] ||= {};data.payments[ui.month][id]={status:v.status,amount:amt,paidAt:v.status==='paid'?(v.paidAt||new Date().toLocaleDateString('sv-SE')):'',note:v.note||''};if(v.status==='paid')confetti();
}else if(kind==='debt'){
 if(!v.name?.trim())throw Error('請填寫負債名稱');let outstanding=validNumber(v.outstanding,'剩餘餘額');if(outstanding!=null&&outstanding<0)throw Error('剩餘餘額不可為負數');const dOld=data.debts.find(x=>x.id===id);
 const d={...(dOld||{}),id:id||uid(),name:v.name.trim(),status:v.status,outstanding:v.status==='已結清'?0:outstanding,principal:validNumber(v.principal,'借款本金'),total:validNumber(v.total,'還款金額'),monthly:validNumber(v.monthly,'每月還款'),periods:validNumber(v.periods,'總期數'),paidPeriods:validNumber(v.paidPeriods,'已繳期數'),estimatedEnd:v.estimatedEnd||'',memo:v.memo||'',source:dOld?.source||'手動新增'};
 for(const key of ['principal','total','monthly','periods','paidPeriods'])if(d[key]!=null&&d[key]<0)throw Error('金額與期數不可為負數');if(d.periods!=null&&d.paidPeriods!=null&&d.paidPeriods>d.periods)throw Error('已繳期數不能大於總期數');if(dOld)Object.assign(dOld,d);else data.debts.push(d);
}else return;
 document.getElementById('modal').close();save();render();toast('💗 已儲存成功！');
}catch(e){alert(e.message||'資料驗證錯誤')}}
function del(kind,id){const cfg={income:['ledger','收入紀錄'],bill:['bills','繳費項目（含各月紀錄）'],debt:['debts','負債紀錄']}[kind];if(!cfg)return;const o=data[cfg[0]].find(x=>x.id===id);if(!o)return;if(!confirm(`確定刪除「${o.title||o.name}」嗎？\n\n刪除後無法復原，建議先匯出備份。`))return;data[cfg[0]]=data[cfg[0]].filter(x=>x.id!==id);if(kind==='bill')Object.keys(data.payments).forEach(m=>delete data.payments[m][id]);save();render();toast('🗑️ 已刪除紀錄')}
function shiftMonth(offset){const [y,m]=ui.month.split('-').map(Number);const next=new Date(y,m-1+offset,1);ui.month=next.getFullYear()+'-'+String(next.getMonth()+1).padStart(2,'0');save();render()}
function downloadFile(contents,name,type){const blob=new Blob([contents],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),300)}
function exportBackup(){const payload={...deepCopy(data),exportedAt:new Date().toISOString(),app:'莓好財務日記'};const date=new Date().toLocaleDateString('sv-SE');downloadFile(JSON.stringify(payload,null,2),'莓好財務日記_完整備份_'+date+'.json','application/json;charset=utf-8');toast('📦 已下載完整 JSON 備份！')}
function csvQuote(v){return '"'+String(v==null?'':v).replaceAll('"','""')+'"'}
function exportCSV(){const cols=[['date','日期'],['category','分類'],['title','項目'],['amount','淨收入'],['revenue','收入售價'],['cost','成本'],['shipping','運費'],['gift','贈品'],['qty','數量'],['party','對象'],['channel','管道'],['status','狀態'],['memo','備註'],['sourceRow','來源列']];const list=data.ledger.filter(x=>String(x.date).startsWith(String(ui.year)));let csv='\uFEFF'+cols.map(x=>csvQuote(x[1])).join(',')+'\r\n'+list.map(r=>cols.map(([k])=>csvQuote(r[k])).join(',')).join('\r\n');downloadFile(csv,'收入明細_'+ui.year+'.csv','text/csv;charset=utf-8');toast('📊 已匯出 '+ui.year+' 年收入 CSV')}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const p=JSON.parse(reader.result);if(!Array.isArray(p.ledger)||!Array.isArray(p.bills)||!Array.isArray(p.debts)||typeof(p.payments||{})!=='object')throw Error('不是有效的財務日記備份');if(!confirm(`匯入備份會覆蓋現在的所有資料：\n${p.ledger.length} 筆收入、${p.bills.length} 筆繳費、${p.debts.length} 筆負債。\n\n請確認你已備份目前資料。是否繼續？`))return;data={version:2,ledger:p.ledger,bills:p.bills,debts:p.debts,payments:p.payments||{},settings:p.settings||{}};ui.year=Number(data.settings.year)||2026;ui.month=data.settings.month||'2026-11';ui.incomeFilter='全部';save();render();toast('🌈 匯入完成！資料已還原')}catch(e){alert('匯入失敗：'+e.message)}document.getElementById('import-file').value=''};reader.readAsText(file)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2900)}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['🌸','💗','✨','🌷','💖','🎀','⭐'];for(let i=0;i<26;i++){const el=document.createElement('span');el.className='confetti';el.textContent=colors[Math.floor(Math.random()*colors.length)];el.style.left=(20+Math.random()*60)+'vw';el.style.top=(28+Math.random()*25)+'vh';el.style.setProperty('--dx',(Math.random()-.5)*340+'px');el.style.setProperty('--dy',(Math.random()-.3)*430+'px');el.style.setProperty('--rot',Math.floor(Math.random()*720)+'deg');el.style.animationDelay=(i*19)+'ms';document.body.appendChild(el);setTimeout(()=>el.remove(),1650)}}
function makeStars(){const root=document.getElementById('stars');for(let i=0;i<16;i++){const s=document.createElement('i');s.textContent=i%3===0?'✦':'✧';s.style.left=(Math.random()*98)+'%';s.style.top=(Math.random()*99)+'%';s.style.fontSize=(10+Math.random()*17)+'px';s.style.animationDelay=(i*.27)+'s';root.appendChild(s)}}
function actionClick(e){const t=e.target.closest('[data-action],[data-nav]');if(!t)return;
if(t.dataset.nav){e.preventDefault();ui.page=t.dataset.nav;location.hash=ui.page;render();window.scrollTo({top:0,behavior:'smooth'});return}
const a=t.dataset.action,id=t.dataset.id;
switch(a){case 'nav-income':case 'nav-payments':case 'nav-debts':ui.page=a.replace('nav-','');location.hash=ui.page;render();break;
case 'add-income':openIncome();break;case 'edit-income':openIncome(id);break;case 'delete-income':del('income',id);break;
case 'add-bill':openBill();break;case 'edit-bill':openBill(id);break;case 'delete-bill':del('bill',id);break;case 'edit-payment':openPayment(id);break;case 'pay':setPayment(id,t.dataset.status);break;
case 'add-debt':openDebt();break;case 'edit-debt':openDebt(id);break;case 'delete-debt':del('debt',id);break;
case 'close-modal':document.getElementById('modal').close();break;
case 'year':ui.year=Number(t.dataset.year);ui.incomeFilter='全部';ui.incomeQuery='';ui.incomeLimit=45;save();render();break;
case 'new-year':{const y=Number(prompt('想新增哪一年？請輸入西元年份（例：2027）','2027'));if(Number.isInteger(y)&&y>=2000&&y<=2100){ui.year=y;ui.page='income';ui.incomeFilter='全部';ui.incomeQuery='';save();render()}else if(y)alert('請輸入 2000～2100 的西元年份');break}
case 'filter-income':ui.incomeFilter=t.dataset.filter;ui.incomeLimit=45;render();break;case 'more-income':ui.incomeLimit+=45;render();break;case 'expand':ui.expandedId=ui.expandedId===id?null:id;render();break;
case 'filter-debt':ui.debtFilter=t.dataset.filter;render();break;
case 'month-prev':shiftMonth(-1);break;case 'month-next':shiftMonth(1);break;
case 'export':exportBackup();break;case 'import':document.getElementById('import-file').click();break;case 'export-csv':exportCSV();break}}
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(['dashboard','income','payments','debts'].includes(page)&&ui.page!==page){ui.page=page;render()}});
document.addEventListener('click',actionClick);
document.addEventListener('submit',e=>{if(e.target.matches('[data-form]')){e.preventDefault();handleSubmit(e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='month-input'&&/^\d{4}-\d{2}$/.test(e.target.value)){ui.month=e.target.value;save();render()}if(e.target.id==='import-file')importBackup(e.target.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='income-query'){const node=e.target,pos=node.selectionStart;ui.incomeQuery=node.value;render();const next=document.getElementById('income-query');if(next){next.focus();next.setSelectionRange(pos,pos)}}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
init();
</script>
</body></html>
